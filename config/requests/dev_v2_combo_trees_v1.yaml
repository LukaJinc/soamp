# Richer peptide inputs, tree half (3 seeds). The plateau (~0.45 val MCC) is input-limited, so test
# PeptideCLM concatenated with molecular-graph features. Trees cannot read a graph, so molgraph enters
# as a fixed pooled vector (151 atom/bond/element-pair counts and fractions):
#   peptideclm                -> control (same XGBoost, same seeds)
#   molgraph_pool             -> pooled graph vector alone
#   peptideclm_molgraph_pool  -> PeptideCLM (768) ++ pooled graph (151)
# XGBoost at the cycle-3 pick: lr 0.03, depth 8 (dev_v2_trees_seeds_v2).
experiment: dev_v2_combo_trees_v1
seeds: [42, 7, 123]
representations:
  peptide: [peptideclm, molgraph_pool, peptideclm_molgraph_pool]
  organism: [vocab]
architectures:
  - name: xgboost_classifier
    hparams:
      n_estimators: 600
      learning_rate: 0.03
      max_depth: 8
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.5
      reg_lambda: 5.0
