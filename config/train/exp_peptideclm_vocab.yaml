# Featurization-grid cell: peptideclm_embedding peptide features x vocab_embedding organism features.
# Architecture is held fixed at attention_fusion_classifier across all four
# cells so the comparison isolates the representation, not the model --
# BaselineClassifier feeds peptide features in raw, so a 768-dim PeptideCLM
# vector would dominate its concat against an 8-dim organism embedding.
_base_: base.yaml

exp_id: peptideclm_vocab_attnfusion

model:
  architecture: attention_fusion_classifier

input_files:
  peptide_features_filename: peptide_features_peptideclm.csv
  peptide_feature_scaler_filename: peptide_feature_scaler_peptideclm.json
  organism_vocab_filename: organism_vocab_vocab_embedding.json

wandb_group: featurization_grid_v1
wandb_tags:
  - peptideclm_embedding
  - vocab_embedding
  - attention_fusion_classifier
