# Cross-validation counterpart to exp_rdkit_dnabert.yaml: same featurization grid cell,
# run through pipeline/train_cv.py's 5-fold CV (5 epochs per fold) instead of
# pipeline/train.py's single held-out split.
_base_: exp_rdkit_dnabert.yaml

exp_id: rdkit_dnabert_cv

loop:
  epochs: 5

wandb_group: featurization_grid_cv_v2
wandb_tags:
  - rdkit_descriptors
  - dnabert_s_16s
  - attention_fusion_classifier
  - cv
