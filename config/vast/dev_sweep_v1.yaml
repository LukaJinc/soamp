# Small hyperparameter sweep on the dev data (PeptideCLM x vocab_embedding, DBAASP 25/100 labels):
# six 40-epoch 5-fold CV cells varying only knobs the code exposes (weight decay, learning rate,
# model size). All cells share wandb group dev_sweep_v1. Compare with
# scripts/vast/summarize_sweep.py. Cells run sequentially on one instance; features are built once.
experiments:
  - config/train/cv_dev_sweep_wd1e-3.yaml
  - config/train/cv_dev_sweep_wd1e-2.yaml
  - config/train/cv_dev_sweep_lr1e-4.yaml
  - config/train/cv_dev_sweep_lr3e-4_wd1e-3.yaml
  - config/train/cv_dev_sweep_small.yaml
  - config/train/cv_dev_sweep_small_wd1e-3.yaml

required_artifacts:
  - data/dev/mic_classification_dataset.csv
  - data/dev/peptide_split.csv

prepare:
  - cmd: [python, pipeline/features/01_build_peptide_features.py, --config, config/features/dev_peptide_peptideclm.yaml]
    produces: [data/dev/peptide_features_peptideclm.csv]
  - cmd: [python, pipeline/features/03_fit_peptide_scaler.py, --config, config/features/dev_peptide_peptideclm.yaml]
    produces: [data/dev/peptide_feature_scaler_peptideclm.json]
  - cmd: [python, pipeline/features/02_build_organism_vocab.py, --config, config/features/dev_organism_vocab.yaml]
    produces: [data/dev/organism_vocab_vocab_embedding.json]

instance:
  gpu_name: A100_SXM4
  num_gpus: 1
  disk_gb: 60
  min_reliability: 0.99   # offers are ranked by reliability, not price (scripts/vast/find_offers.py)
  max_hours: 2            # ~6 cells x ~6 min + feature build
  grace_seconds: 90
