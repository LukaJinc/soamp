# Dev v2 (per-organism-balanced split), linear peptides only: a row filter on data/dev_v2_orgbal that keeps
# the peptides with no intrachain bond (DBAASP) and no macrocycle or disulfide in their SMILES. Labels and
# split assignments are the ones data/dev_v2_orgbal already has -- nothing is relabelled or re-split, and
# the split already balances per-organism active share on the linear pairs too (config/data/dev_v2_orgbal.yaml).
# Run: python pipeline/data/05_build_linear_subset.py --config config/data/dev_v2_orgbal_linear.yaml
# then refit the three peptide scalers (see that script's docstring).

paths:
  source_dir: data/dev_v2_orgbal
  out_dir: data/dev_v2_orgbal_linear
  reports_dir: reports/dev_v2_orgbal_linear
