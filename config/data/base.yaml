paths:
  data_dir: data
  reports_dir: reports

input_files:
  regression_dataset_filename: final_mic_regression_dataset.csv
  activity_labels_filename: mic_activity_labels.csv
  split_indices_filename: split_indices.json

output:
  filename: mic_classification_dataset.csv
  val_split_filename: val_split.json

label_filter:
  included_labels: [active, inactive]

val_split:
  val_fraction: 0.3
  seed: 42
  identity_threshold: 0.60
  post_filtering: true
